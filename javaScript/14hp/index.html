<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        background-color:green;
        color:white;
        }
    </style>
</head>
<body>
    <!-- Create a hacking simulator which shows green screen and shows these messages with a random delay of 1 to 7 seconds
     Initiallizing hacking....
     Reading your Files....
     Password files Detected....
     sending all password and files to server....
     cleaning up....

     The three dots must blink
      -->
     <div>
        Initializinghacking ...
     </div>
     <script >

        
        const addItem=async(item)=>{
           await randomDelay();
           let div = document.createElement("div");
           div.innerHTML=item;
           document.body.append(div);
        }

        const randomDelay=()=>{
            let timeout = 1+6*Math.random();
            setTimeout((resolve,reject)=>{
                resolve();
            },timeout*1000);
        }
       async function main(){

        setInterval(()=>{
            let last =document.body.getElementsByTagName("div");
            last =[last.length()-1];
            if(last.innerHTML.endsWith("...")){
                last.innerHTML=last.innerHTML.slice(0,last.innerHTML.length-3);
            }else{
                last.innerHTML+=".";
            }
        },700);

        let texts=[
            " Initiallizing hacking",
     "Reading your Files",
    " Password files Detected",
     "sending all password and files to server",
     "cleaning up"
        ]

        for(let item of text) {
            await addItem(item);
        }
 }
 main();
        
     </script>
</body>
</html>
